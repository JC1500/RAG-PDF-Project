<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot App</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1f2330; --border:#2a2f3d;
    --text:#e8eaf0; --muted:#8b91a5; --accent:#5b8def; --accent-2:#3f6fd8;
    --user-bubble:#2b3550; --bot-bubble:#1f2330; --danger:#e5555f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex;
  }
  #login-screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; background:var(--bg); z-index:50; gap:18px; text-align:center; padding:20px;
  }
  #login-screen h1{margin:0; font-size:26px;}
  #login-screen p{color:var(--muted); margin:0;}
  #google-login-btn{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:#3c4043;
    border:none; border-radius:8px; padding:11px 20px; font-size:14.5px; font-weight:600;
    cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  #google-login-btn:hover{background:#f4f4f4;}
  #google-login-btn svg{width:18px; height:18px;}
  #login-checking{color:var(--muted); font-size:13px;}
  #app{display:none; width:100%; height:100vh;}
  #app.visible{display:flex;}
  #sidebar{
    width:280px; min-width:280px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:16px;
  }
  #sidebar h2{font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px;}
  #user-box{
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    margin-bottom:16px; font-size:13px; line-height:1.5; word-break:break-word;
  }
  #user-box .label{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  #logout-btn{
    margin-top:8px; width:100%; padding:6px 10px; font-size:12px; border-radius:6px;
    border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer;
  }
  #logout-btn:hover{color:var(--danger); border-color:var(--danger);}
  #new-conv-btn{
    width:100%; padding:10px; border:none; border-radius:8px; background:var(--accent);
    color:white; font-weight:600; cursor:pointer; margin-bottom:18px; font-size:14px;
  }
  #new-conv-btn:hover{background:var(--accent-2);}
  #session-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .session-btn{
    text-align:left; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 10px; border-radius:8px; cursor:pointer; font-size:12.5px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .session-btn:hover{border-color:var(--accent);}
  .session-btn.active{border-color:var(--accent); background:#232a40;}
  #main{flex:1; display:flex; flex-direction:column; height:100vh;}
  #topbar{
    padding:14px 22px; border-bottom:1px solid var(--border); display:flex;
    align-items:center; justify-content:space-between; background:var(--panel);
  }
  #topbar .title{font-size:16px; font-weight:600;}
  #topbar .thread{font-size:11px; color:var(--muted); font-family:monospace;}
  #chat-window{
    flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px;
  }
  .msg-row{display:flex;}
  .msg-row.user{justify-content:flex-end;}
  .bubble{
    max-width:70%; padding:11px 15px; border-radius:14px; font-size:14.5px; line-height:1.5;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .msg-row.user .bubble{background:var(--user-bubble); border-bottom-right-radius:4px;}
  .msg-row.assistant .bubble{background:var(--bot-bubble); border:1px solid var(--border); border-bottom-left-radius:4px;}
  .empty-state{margin:auto; color:var(--muted); text-align:center; font-size:14px;}
  #composer{
    border-top:1px solid var(--border); background:var(--panel); padding:14px 20px 18px;
  }
  #ingest-row{
    display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px; color:var(--muted);
  }
  #file-input{display:none;}
  #file-label{
    display:inline-flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--border);
    padding:6px 12px; border-radius:8px; cursor:pointer; color:var(--text); font-size:12.5px;
  }
  #file-label:hover{border-color:var(--accent);}
  #file-name{color:var(--muted); font-style:italic;}
  #ingest-status{font-size:12px;}
  #ingest-status.ok{color:#4caf7d;}
  #ingest-status.err{color:var(--danger);}
  #input-row{display:flex; gap:10px;}
  #chat-input{
    flex:1; resize:none; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:14.5px; font-family:inherit; min-height:46px; max-height:140px;
  }
  #chat-input:focus{outline:none; border-color:var(--accent);}
  #send-btn{
    background:var(--accent); border:none; color:white; padding:0 22px; border-radius:10px;
    font-weight:600; cursor:pointer; font-size:14px;
  }
  #send-btn:disabled{opacity:.5; cursor:not-allowed;}
  #send-btn:hover:not(:disabled){background:var(--accent-2);}
  .typing{color:var(--muted); font-size:13px; font-style:italic; padding-left:4px;}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Welcome to Chatbot App</h1>
  <p>Please log in to continue.</p>
  <button id="google-login-btn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.1 4 9.2 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.4C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-7.9l-6.5 5C9.1 39.6 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.4C40.9 36.5 44 30.8 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
    Sign in with Google
  </button>
  <div id="login-checking"></div>
</div>

<div id="app">
  <div id="sidebar">
    <h2>My Conv</h2>
    <button id="new-conv-btn">+ New Conversation</button>
    <div id="user-box">
      <div class="label">Logged in as</div>
      <div id="user-email-display"></div>
      <button id="logout-btn">Log out</button>
    </div>
    <h2 style="margin-top:4px;">Message History</h2>
    <div id="session-list"></div>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="title">Chatbot</div>
      <div class="thread" id="thread-display"></div>
    </div>

    <div id="chat-window">
      <div class="empty-state" id="empty-state">Start a conversation, or upload a document to chat with it.</div>
    </div>

    <div id="composer">
      <div id="ingest-row">
        <label id="file-label" for="file-input">📎 Attach document</label>
        <input type="file" id="file-input" accept=".pdf,.xps,.epub,.cbz,.mobi,.fb2,.svg,.txt,.md">
        <span id="file-name"></span>
        <span id="ingest-status"></span>
      </div>
      <div id="input-row">
        <textarea id="chat-input" placeholder="Type here..." rows="1"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "";

let currentUser = null;
let sessionId = null;
let sessions = new Set();
let messageHist = [];

const LS_KEY = (email) => `chatbot_sessions_${email}`;
const LS_MSG_KEY = (email, tid) => `chatbot_messages_${email}_${tid}`;

async function checkAuth() {
  try {
    const res = await fetch(`${API_BASE}/auth/me`, { credentials: "include" });
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}

document.getElementById("google-login-btn").addEventListener("click", () => {
  window.location.href = `${API_BASE}/auth/login`;
});

document.getElementById("logout-btn").addEventListener("click", () => {
  window.location.href = `${API_BASE}/auth/logout`;
});

function uuidv4() {
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)
  );
}

function loadSessionsFromStorage() {
  const raw = localStorage.getItem(LS_KEY(currentUser.email));
  sessions = new Set(raw ? JSON.parse(raw) : []);
}
function saveSessionsToStorage() {
  localStorage.setItem(LS_KEY(currentUser.email), JSON.stringify([...sessions]));
}
function loadMessagesForSession(tid) {
  const raw = localStorage.getItem(LS_MSG_KEY(currentUser.email, tid));
  return raw ? JSON.parse(raw) : [];
}
function saveMessagesForSession(tid) {
  localStorage.setItem(LS_MSG_KEY(currentUser.email, tid), JSON.stringify(messageHist));
}

function createNewSession() {
  sessionId = uuidv4();
  messageHist = [];
  sessions.add(sessionId);
  saveSessionsToStorage();
  renderSessionList();
  renderChat();
  updateThreadDisplay();
}

function switchToSession(tid) {
  sessionId = tid;
  messageHist = loadMessagesForSession(tid);
  renderChat();
  renderSessionList();
  updateThreadDisplay();
}

function updateThreadDisplay() {
  document.getElementById("thread-display").textContent = "thread: " + sessionId;
}

function renderSessionList() {
  const list = document.getElementById("session-list");
  list.innerHTML = "";
  [...sessions].forEach(tid => {
    const btn = document.createElement("button");
    btn.className = "session-btn" + (tid === sessionId ? " active" : "");
    btn.textContent = tid;
    btn.title = tid;
    btn.addEventListener("click", () => switchToSession(tid));
    list.appendChild(btn);
  });
}

function renderChat() {
  const win = document.getElementById("chat-window");
  win.innerHTML = "";
  if (messageHist.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.id = "empty-state";
    empty.textContent = "Start a conversation, or upload a document to chat with it.";
    win.appendChild(empty);
    return;
  }
  messageHist.forEach(m => appendBubble(m.avatar, m.message, false));
  win.scrollTop = win.scrollHeight;
}

function appendBubble(avatar, text, scroll = true) {
  const win = document.getElementById("chat-window");
  const empty = document.getElementById("empty-state");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = "msg-row " + avatar;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  win.appendChild(row);
  if (scroll) win.scrollTop = win.scrollHeight;
  return bubble;
}

async function sendChat(inp) {
  const res = await fetch(`${API_BASE}/chat`, {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ inp: inp, thread_id: sessionId })
  });
  if (res.status === 401) {
    window.location.href = `${API_BASE}/auth/login`;
    throw new Error("Session expired — redirecting to login.");
  }
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err || `Request failed (${res.status})`);
  }
  return res.json();
}

async function ingestFile(file) {
  const url = `${API_BASE}/ingest?` + new URLSearchParams({ thread_id: sessionId }).toString();
  const formData = new FormData();
  formData.append("file", file);
  const res = await fetch(url, { method: "POST", credentials: "include", body: formData });
  if (res.status === 401) {
    window.location.href = `${API_BASE}/auth/login`;
    throw new Error("Session expired — redirecting to login.");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.detail || `Ingest failed (${res.status})`);
  }
  return data;
}

document.getElementById("new-conv-btn").addEventListener("click", () => {
  if (messageHist.length > 0) createNewSession();
});

const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");

chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + "px";
});

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

sendBtn.addEventListener("click", handleSend);

async function handleSend() {
  const text = chatInput.value.trim();
  if (!text) return;

  chatInput.value = "";
  chatInput.style.height = "auto";
  sendBtn.disabled = true;

  messageHist.push({ avatar: "user", message: text });
  appendBubble("user", text);
  saveMessagesForSession(sessionId);

  const win = document.getElementById("chat-window");
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Assistant is typing…";
  win.appendChild(typing);
  win.scrollTop = win.scrollHeight;

  try {
    const data = await sendChat(text);
    typing.remove();
    const replyText = typeof data.response === "string" ? data.response : JSON.stringify(data.response);
    messageHist.push({ avatar: "assistant", message: replyText });
    appendBubble("assistant", replyText);
    saveMessagesForSession(sessionId);
    if (!sessions.has(sessionId)) {
      sessions.add(sessionId);
      saveSessionsToStorage();
      renderSessionList();
    }
  } catch (err) {
    typing.remove();
    appendBubble("assistant", "⚠️ Error: " + err.message);
  } finally {
    sendBtn.disabled = false;
    chatInput.focus();
  }
}

const fileInput = document.getElementById("file-input");
const fileNameEl = document.getElementById("file-name");
const ingestStatusEl = document.getElementById("ingest-status");

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileNameEl.textContent = file.name;
  ingestStatusEl.textContent = "Uploading & processing…";
  ingestStatusEl.className = "";

  try {
    const data = await ingestFile(file);
    ingestStatusEl.textContent = `✓ Ingested (${data.chunks_ingested} chunks)`;
    ingestStatusEl.className = "ok";
  } catch (err) {
    ingestStatusEl.textContent = "✗ " + err.message;
    ingestStatusEl.className = "err";
  } finally {
    fileInput.value = "";
  }
});

function enterApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").classList.add("visible");
  document.getElementById("user-email-display").textContent = currentUser.email;

  loadSessionsFromStorage();
  if (sessions.size === 0) {
    createNewSession();
  } else {
    const first = [...sessions][0];
    switchToSession(first);
  }
}

(async function init() {
  document.getElementById("login-checking").textContent = "Checking session…";
  const user = await checkAuth();
  document.getElementById("login-checking").textContent = "";
  if (user) {
    currentUser = user;
    enterApp();
  }
})();
</script>
</body>
</html>
